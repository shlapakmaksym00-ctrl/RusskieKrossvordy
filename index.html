<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>Русские кроссворды</title>
<style>
:root{--bg:#101827;--panel:#1c293b;--cell:#f5f7fb;--ink:#172033;--accent:#65e0b7;--muted:#a9b6c9;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101827,#17263a);color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;padding:18px 14px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:850;font-size:clamp(22px,5vw,32px);letter-spacing:-.6px}.brand span{color:var(--accent)}.score{background:#26364b;border:1px solid #344860;padding:9px 12px;border-radius:14px;font-weight:750;white-space:nowrap}
.sub{color:var(--muted);margin:7px 0 17px;font-size:14px}.card{background:rgba(28,41,59,.94);border:1px solid #344860;border-radius:20px;padding:15px;margin-bottom:14px;box-shadow:0 12px 35px #0002}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.level{font-weight:800;font-size:18px}.pill{font-size:12px;color:var(--accent);background:#24483f;padding:6px 10px;border-radius:99px}
.gridwrap{display:flex;justify-content:center;margin:15px 0 12px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:min(100%,420px);touch-action:manipulation}.cell{aspect-ratio:1;border-radius:6px;background:var(--cell);color:var(--ink);border:2px solid transparent;position:relative;display:flex;align-items:center;justify-content:center;font-weight:850;font-size:clamp(15px,4vw,24px);padding:0;text-transform:uppercase}.cell.block{background:#34445b}.cell.active{border-color:var(--accent);background:#d8fff0}.cell.done{background:#b9f4d9}.num{position:absolute;top:1px;left:3px;font-size:8px;font-weight:700;color:#667085}.empty{visibility:hidden}.question{font-size:17px;font-weight:750;line-height:1.35;min-height:48px;margin:3px 0 12px}.qmeta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.answer{width:100%;background:#101827;color:white;border:1px solid #42556e;border-radius:13px;padding:14px;font-size:18px;font-weight:750;letter-spacing:2px;text-transform:uppercase;outline:none}.answer:focus{border-color:var(--accent)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}button{border:0;border-radius:13px;padding:12px 10px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#10251f}.secondary{background:#2b3b51;color:#f5f7fb;border:1px solid #40536b}.tinyrow{display:flex;gap:8px;margin-top:12px}.tinyrow button{flex:1}.hint{color:var(--gold);font-size:13px;min-height:18px;margin-top:9px}.clues h3{margin:0 0 10px;font-size:17px}.clue{display:flex;gap:10px;padding:10px 8px;border-radius:11px;color:#dce5f1;line-height:1.35;font-size:14px;cursor:pointer}.clue strong{color:var(--accent);min-width:20px}.clue.selected{background:#2b3e52}.clue.solved{color:#8fa89e;text-decoration:line-through}.footer{text-align:center;color:#778aa4;font-size:12px;margin:18px 0 0}
@media(min-width:650px){.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.layout .card{margin-bottom:14px}.grid{width:min(100%,390px)}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="brand">Русские <span>кроссворды</span></div><div class="score">⭐ <b id="score">0</b></div></div>
<div class="sub">Разгадывай слова, открывай уровни и тренируй память</div>
<div class="row card"><div><div class="level" id="levelTitle">Уровень 1</div><div style="color:var(--muted);font-size:13px;margin-top:3px" id="progress">0 из 6 слов</div></div><span class="pill" id="difficulty">ЛЁГКИЙ</span></div>
<div class="layout"><section class="card"><div class="row"><b>Кроссворд</b><span style="color:var(--muted);font-size:12px">Нажми на клетку</span></div><div class="gridwrap"><div class="grid" id="grid"></div></div><div class="qmeta" id="direction">ПО ГОРИЗОНТАЛИ · 1</div><div class="question" id="question">Выбери слово в сетке</div><input id="answer" class="answer" autocomplete="off" autocapitalize="characters" placeholder="ВВЕДИ ОТВЕТ"><div class="actions"><button class="primary" id="check">Проверить</button><button class="secondary" id="hintBtn">💡 Подсказка</button></div><div class="hint" id="hint"></div><div class="tinyrow"><button class="secondary" id="prev">← Назад</button><button class="secondary" id="next">Следующее →</button></div></section>
<section class="card clues"><h3>Вопросы</h3><div id="clues"></div><button class="primary" id="newLevel" style="width:100%;margin-top:12px;display:none">Следующий уровень →</button></section></div>
<div class="footer">Игра работает офлайн · Прогресс хранится на устройстве</div>
</main>
<script>
const levels=[
{difficulty:"ЛЁГКИЙ",words:[
{n:1,d:"h",r:0,c:0,a:"КОШКА",q:"Домашнее животное, которое ловит мышей"},
{n:2,d:"v",r:0,c:2,a:"ОСЕНЬ",q:"Время года после лета"},
{n:3,d:"h",r:2,c:1,a:"СОЛНЦЕ",q:"Оно светит днём на небе"},
{n:4,d:"v",r:1,c:5,a:"МОРЕ",q:"Большой солёный водоём"},
{n:5,d:"h",r:4,c:0,a:"КНИГА",q:"Её читают"},
{n:6,d:"h",r:6,c:2,a:"ЛЕС",q:"Много деревьев на большой территории"}
]},
{difficulty:"СРЕДНИЙ",words:[
{n:1,d:"h",r:0,c:1,a:"РАДУГА",q:"Разноцветная дуга после дождя"},
{n:2,d:"v",r:0,c:3,a:"АРБУЗ",q:"Большая зелёная ягода с красной мякотью"},
{n:3,d:"h",r:2,c:0,a:"ЗИМА",q:"Самое холодное время года"},
{n:4,d:"v",r:1,c:6,a:"ЗВЕЗДА",q:"Светится на ночном небе"},
{n:5,d:"h",r:4,c:1,a:"ПОЕЗД",q:"Едет по рельсам"},
{n:6,d:"h",r:6,c:0,a:"МУЗЫКА",q:"Её слушают и играют"}
]},
{difficulty:"СЛОЖНЫЙ",words:[
{n:1,d:"h",r:0,c:0,a:"ПЛАНЕТА",q:"Небесное тело, вращающееся вокруг звезды"},
{n:2,d:"v",r:0,c:2,a:"ЛИТЕРАТУРА",q:"Искусство слова и совокупность письменных произведений"},
{n:3,d:"h",r:2,c:0,a:"КОМПАС",q:"Прибор для определения сторон света"},
{n:4,d:"v",r:0,c:5,a:"ТЕЛЕФОН",q:"Устройство для голосовой связи"},
{n:5,d:"h",r:4,c:0,a:"ОБЛАКО",q:"Видимая масса водяных капель в небе"},
{n:6,d:"h",r:6,c:1,a:"ЗАГАДКА",q:"Задача, требующая догадки"}
]}];
let levelIndex=0, score=Number(localStorage.getItem("rc_score")||0), solved=JSON.parse(localStorage.getItem("rc_solved")||"{}"), activeWord=0, hintUsed={};
const $=id=>document.getElementById(id);
function key(){return levelIndex+"-"+activeWord}
function save(){localStorage.setItem("rc_score",score);localStorage.setItem("rc_solved",JSON.stringify(solved))}
function words(){return levels[levelIndex].words}
function isSolved(i){return !!solved[levelIndex+"-"+i]}
function dims(){let R=7,C=7;words().forEach(w=>{R=Math.max(R,w.r+(w.d==="v"?w.a.length:1));C=Math.max(C,w.c+(w.d==="h"?w.a.length:1))});return {R,C}}
function cellMap(){let map={};words().forEach((w,i)=>{for(let k=0;k<w.a.length;k++){let r=w.r+(w.d==="v"?k:0),c=w.c+(w.d==="h"?k:0),id=r+","+c;if(!map[id])map[id]={r,c,letters:[],nums:[]};map[id].letters.push({i,k});if(k===0)map[id].nums.push(w.n)}});return map}
function render(){
 $("score").textContent=score;$("levelTitle").textContent="Уровень "+(levelIndex+1);$("difficulty").textContent=levels[levelIndex].difficulty;$("progress").textContent=words().filter((w,i)=>isSolved(i)).length+" из "+words().length+" слов";
 let {R,C}=dims(),map=cellMap(),grid=$("grid");grid.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;grid.innerHTML="";
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){let info=map[r+","+c],b=document.createElement("button");b.className="cell"+(info?"":" block");if(!info){b.disabled=true;b.innerHTML="";}else{let owner=info.letters.find(x=>x.i===activeWord);if(owner)b.classList.add("active");if(info.letters.every(x=>isSolved(x.i)))b.classList.add("done");let letter="";info.letters.forEach(x=>{if(isSolved(x.i))letter=words()[x.i].a[x.k]});b.textContent=letter; if(info.nums.length){let n=document.createElement("span");n.className="num";n.textContent=info.nums.join(",");b.appendChild(n)}b.onclick=()=>{let match=info.letters.find(x=>x.i===activeWord)||info.letters[0];activeWord=match.i;render();$("answer").focus()}}grid.appendChild(b)}
 $("direction").textContent=(words()[activeWord].d==="h"?"ПО ГОРИЗОНТАЛИ":"ПО ВЕРТИКАЛИ")+" · "+words()[activeWord].n;
 $("question").textContent=words()[activeWord].q;$("answer").value=isSolved(activeWord)?words()[activeWord].a:"";$("answer").placeholder="Букв: "+words()[activeWord].a.length;
 $("clues").innerHTML="";words().forEach((w,i)=>{let div=document.createElement("div");div.className="clue"+(i===activeWord?" selected":"")+(isSolved(i)?" solved":"");div.innerHTML=`<strong>${w.n}</strong><span>${w.q}</span>`;div.onclick=()=>{activeWord=i;render()};$("clues").appendChild(div)});
 $("newLevel").style.display=words().every((w,i)=>isSolved(i))?(levelIndex<levels.length-1?"block":"none"):"none";
}
function check(){let ans=$("answer").value.toUpperCase().replace(/Ё/g,"Е").replace(/[^А-Я]/g,""),correct=words()[activeWord].a.replace(/Ё/g,"Е");if(isSolved(activeWord)){ $("hint").textContent="Это слово уже разгадано!";return}if(ans===correct){solved[levelIndex+"-"+activeWord]=true;score+=10;save();$("hint").textContent="Верно! +10 очков 🎉";render();if(words().every((w,i)=>isSolved(i)))$("hint").textContent="Уровень пройден! Отличная работа! 🎉"}else{$("hint").textContent=ans.length?"Пока неверно. Попробуй ещё раз!":"Введи ответ";}}
function hint(){let w=words()[activeWord];if(isSolved(activeWord)){$("hint").textContent="Это слово уже открыто.";return}let k=key();if(!hintUsed[k]){hintUsed[k]=0}if(hintUsed[k]===0){$("hint").textContent="Первая буква: "+w.a[0];hintUsed[k]=1}else if(hintUsed[k]===1){$("hint").textContent="Последняя буква: "+w.a[w.a.length-1];hintUsed[k]=2}else{$("hint").textContent="Ответ: "+w.a+" (за открытие очки не начисляются)";$("answer").value=w.a;hintUsed[k]=3}}
$("check").onclick=check;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});$("hintBtn").onclick=hint;
$("prev").onclick=()=>{activeWord=(activeWord+words().length-1)%words().length;$("hint").textContent="";render()};
$("next").onclick=()=>{activeWord=(activeWord+1)%words().length;$("hint").textContent="";render()};
$("newLevel").onclick=()=>{if(levelIndex<levels.length-1){levelIndex++;activeWord=0;$("hint").textContent="";render()}};
render();
</script></body></html>
