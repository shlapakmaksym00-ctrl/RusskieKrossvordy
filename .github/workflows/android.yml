name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RusskieKrossvordy_GitHub_Build.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -o RusskieKrossvordy_GitHub_Build.zip

      - name: Build APK
        working-directory: RusskieKrossvordy
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: russkie-krossvordy-apk
          path: RusskieKrossvordy/app/build/outputs/apk/debug/app-debug.apk
